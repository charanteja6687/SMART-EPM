# ================================
# Server Configuration
# ================================
server.port=8080
server.servlet.context-path=/

# ================================
# MySQL Database Configuration
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_epm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate Configuration
# ================================
# ddl-auto=update: Hibernate creates/updates tables automatically on startup.
# No manual DB reset is ever required — safe for repeated runs and multiple users.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# true: keeps the Hibernate session open for the whole request so lazy relationships
# (e.g. Project.employees) can still be loaded when building response DTOs.
spring.jpa.open-in-view=true

# ================================
# JWT Configuration
# ================================
app.jwt.secret=${JWT_SECRET:SmartEmployeeProjectManagementSystemSuperSecretKeyForJWTSigning2024ChangeInProd}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ================================
# Logging
# ================================
logging.level.root=INFO
logging.level.com.smartepm=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n
logging.file.name=logs/smart-epm.log

# ================================
# CORS
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

